<app-navbar></app-navbar>

<main class="main-content">
    <div class="contenedor-tabla">
        <div class="header-tabla">
            <h1 class="titulo-pagina">Funcionarios</h1>
            <button class="btn-azul-nuevo" (click)="toggleFormulario()">
                {{ mostrarFormulario ? 'Cerrar Formulario' : 'Agregar Nuevo' }} 
                <i class="pi" [ngClass]="mostrarFormulario ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
            </button>
        </div>

        <div class="form-container" [class.abierto]="mostrarFormulario">
            <form (ngSubmit)="onGuardar()" #funcionarioForm="ngForm" class="form-horizontal">
                
                <input type="text" pInputText [(ngModel)]="funcionarioActual.nombre" name="nombre" placeholder="Nombre completo" required>
                
                <select [(ngModel)]="funcionarioActual.tipoDocumento" name="tipoDocumento" class="p-inputtext" required>
                    <option value="" disabled selected>Tipo de documento</option>
                    <option value="C.C">Cédula de ciudadanía</option>
                    <option value="T.I">Tarjeta de identidad</option>
                    <option value="C.E">Cédula de extranjería</option>
                    <option value="P.S">Pasaporte</option>
                    <option value="P.E.P">Permiso especial de permanencia</option>
                </select>

                <input type="number" pInputText [(ngModel)]="funcionarioActual.numeroDocumento" name="numeroDocumento" placeholder="Número de documento" [disabled]="esEdicion" required>
                
                <input type="number" pInputText [(ngModel)]="funcionarioActual.rolId" name="rolId" placeholder="ID de Rol" [disabled]="esEdicion" required>
                
                <input type="number" pInputText [(ngModel)]="funcionarioActual.cargoId" name="cargoId" placeholder="ID de Cargo" required>

                <input type="password" pInputText [(ngModel)]="funcionarioActual.contrasena" name="contrasena" placeholder="Contraseña" *ngIf="!esEdicion" required>
                
                <div class="botones-form">
                    <button type="submit" [class]="esEdicion ? 'btn-actualizar' : 'btn-guardar-verde'" [disabled]="!funcionarioForm.form.valid">
                        {{ esEdicion ? 'Actualizar' : 'Guardar' }}
                    </button>
                    <button type="button" *ngIf="esEdicion" class="btn-cancelar" (click)="resetForm()">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="tabla-wrapper">
            <p-table [value]="listaFuncionarios" styleClass="p-datatable-striped tabla-funcionarios" [tableStyle]="{'min-width': '50rem'}">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo documento</th>
                        <th>Número de documento</th>
                        <th>Cargo</th>
                        <th>Acciones</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-f>
                    <tr>
                        <td class="bold">{{ f.nombre }}</td>
                        <td>{{ f.tipoDocumento }}</td>
                        <td>{{ f.numeroDocumento }}</td>
                        <td>{{ f.cargoNombre }}</td>
                        <td>
                            <div class="acciones-container">
                                <button pButton icon="pi pi-pencil" 
                                        class="p-button-rounded p-button-text p-button-info" 
                                        (click)="seleccionarFuncionario(f, 'editar')" 
                                        pTooltip="Editar">
                                </button>
                                <button pButton icon="pi pi-trash" 
                                        class="p-button-rounded p-button-text p-button-danger" 
                                        (click)="seleccionarFuncionario(f, 'eliminar')" 
                                        pTooltip="Eliminar">
                                </button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>

        <div class="paginacion-container">
            <button class="btn-pag-nav" type="button">《</button>
            <button class="btn-pag active" type="button">1</button>
            <button class="btn-pag-nav" type="button">》</button>
        </div>
    </div>
</main>

<p-dialog [(visible)]="mostrarModalEliminar" [modal]="true" header="Confirmar acción" 
    [closable]="true" [style]="{width: '450px'}" styleClass="dialogo-premium">
    <div class="modal-body">
        <div class="alerta-circulo">
            <i class="pi pi-exclamation-triangle"></i>
        </div>
        <h2 class="titulo-alerta text-center">¿Estás seguro?</h2>
        <p class="texto-confirmacion text-center m-0">
            ¿Realmente deseas eliminar este funcionario? Esta acción <strong>no se puede deshacer</strong>.
        </p>
    </div>
    <ng-template pTemplate="footer">
        <div class="botones-container">
            <button pButton label="No, cancelar" icon="pi pi-times" class="p-button-text p-button-secondary" (click)="cerrarModal()"></button>
            <button pButton label="Sí, eliminar" icon="pi pi-trash" class="p-button-danger p-button-raised" (click)="eliminarConfirmado()"></button>
        </div>
    </ng-template>
</p-dialog>

<div *ngIf="verToast" class="toast-mensaje p-3 rounded" 
     [ngClass]="mensajeToast.includes('Error') ? 'bg-danger text-white' : 'bg-success text-white'" 
     style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
    <i class="pi" [ngClass]="mensajeToast.includes('Error') ? 'pi-times-circle' : 'pi-check-circle'" style="margin-right: 8px;"></i>
    {{ mensajeToast }}
</div>
