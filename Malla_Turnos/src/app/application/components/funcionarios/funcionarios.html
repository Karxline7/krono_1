<app-navbar></app-navbar>

<main class="main-content">
    <div class="contenedor-tabla">

        <!-- HEADER -->
        <div class="header-tabla">
            <h1 class="titulo-pagina">Funcionarios</h1>
            <button class="btn-azul-nuevo" (click)="toggleFormulario()">
                {{ mostrarFormulario ? 'Cerrar Formulario' : 'Agregar Nuevo' }} 
                <i class="pi" [ngClass]="mostrarFormulario ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
            </button>
        </div>

        <!-- FORMULARIO -->
        <div class="form-container" [class.abierto]="mostrarFormulario">
            <form (ngSubmit)="onGuardar()" #funcionarioForm="ngForm" class="form-grid">

                <div class="form-field">
                    <label>Nombre Completo</label>
                    <input type="text" pInputText [(ngModel)]="funcionarioActual.nombre" name="nombre" required>
                </div>

                <div class="form-field">
                    <label>Tipo Documento</label>
                    <select [(ngModel)]="funcionarioActual.tipoDocumento" name="tipoDocumento" class="p-inputtext" required>
                        <option value="" disabled>Seleccione...</option>
                        <option value="C.C">Cédula</option>
                        <option value="T.I">Tarjeta</option>
                        <option value="C.E">Extranjería</option>
                        <option value="P.S">Pasaporte</option>
                        <option value="P.E.P">PEP</option>
                    </select>
                </div>

                <div class="form-field">
                    <label>Número Documento</label>
                    <input type="number" pInputText [(ngModel)]="funcionarioActual.numeroDocumento"
                        name="numeroDocumento" [disabled]="esEdicion" required>
                </div>

                <div class="form-field">
                    <label>Rol ID</label>
                    <input type="number" pInputText [(ngModel)]="funcionarioActual.rolId"
                        name="rolId" [disabled]="esEdicion" required>
                </div>

                <div class="form-field">
                    <label>Cargo ID</label>
                    <input type="number" pInputText [(ngModel)]="funcionarioActual.cargoId"
                        name="cargoId" required>
                </div>

                <div class="form-field">
                    <label>Área ID</label>
                    <input type="number" pInputText [(ngModel)]="funcionarioActual.areaId"
                        name="areaId" required>
                </div>

                <!-- SOLO EN CREAR -->
                <div class="form-field" *ngIf="!esEdicion">
                    <label>Contraseña</label>
                    <input type="password" pInputText [(ngModel)]="funcionarioActual.contrasena"
                        name="contrasena" required>
                </div>

                <div class="botones-form">
                    <button type="button" class="btn-cancelar"
                        (click)="toggleFormulario()" [disabled]="procesando">
                        Cancelar
                    </button>

                    <button type="submit"
                        [class]="esEdicion ? 'btn-actualizar' : 'btn-guardar-verde'"
                        [disabled]="!funcionarioForm.form.valid || procesando">

                        <i class="pi pi-spin pi-spinner" *ngIf="procesando"></i>

                        {{ esEdicion ? 'Actualizar' : 'Guardar' }}
                    </button>
                </div>

            </form>
        </div>

        <!-- TABLA -->
        <div class="tabla-wrapper">
            <table class="tabla-funcionarios">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo documento</th>
                        <th>Número</th>
                        <th>Cargo</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let f of listaFuncionarios">
                        <td class="bold">{{ f.nombre }}</td>
                        <td><span class="badge">{{ f.tipoDocumento }}</span></td>
                        <td>{{ f.numeroDocumento }}</td>
                        <td>{{ f.cargoNombre }}</td>

                        <td class="acciones">
                            <button class="btn btn-outline-warning"
                                (click)="seleccionarFuncionario(f, 'editar')">
                                Editar
                            </button>

                            <button class="btn btn-outline-danger"
                                (click)="seleccionarFuncionario(f, 'eliminar')">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<!-- 🔴 MODAL ELIMINAR -->
<p-dialog [(visible)]="mostrarModalEliminar" [modal]="true"
    header="Confirmar eliminación" [style]="{width: '400px'}">

    <div class="text-center">
        <h3>¿Eliminar funcionario?</h3>
        <p>Esta acción no se puede deshacer.</p>
    </div>

    <ng-template pTemplate="footer">
        <button pButton label="Cancelar"
            class="p-button-text"
            (click)="cerrarModalEliminar()"></button>

        <button pButton label="Eliminar"
            class="p-button-danger"
            (click)="eliminarConfirmado()"></button>
    </ng-template>
</p-dialog>


<!-- 🟢 TOAST -->
<div *ngIf="verToast"
     class="toast-mensaje p-3 rounded"
     [ngClass]="mensajeToast.includes('Error') ? 'bg-danger text-white' : 'bg-success text-white'"
     style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">

    <i class="pi"
       [ngClass]="mensajeToast.includes('Error') ? 'pi-times-circle' : 'pi-check-circle'">
    </i>

    {{ mensajeToast }}
</div>
