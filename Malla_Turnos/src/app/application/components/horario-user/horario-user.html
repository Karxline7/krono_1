<app-navbar-user></app-navbar-user>

<div class="main-container">
    <section class="turnos-card">
        <div class="perfil-sidebar">
            <div class="avatar-verde">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <h3 class="nombre">{{ nombreUsuario }}</h3>
            <p class="cargo">{{ cargoUsuario }}</p>
        </div>

        <div class="horario-container">
            <h2 class="titulo-seccion">Turnos</h2>
            <div class="grilla-horario">
                <!-- Etiquetas de día generadas dinámicamente -->
                <div class="dia-label" *ngFor="let dia of diasTexto">
                    {{ dia.nombre }}<br>
                    <span style="font-size: 0.7em; font-weight: normal; opacity: 0.8">{{ dia.fecha }}</span>
                </div>

                <!-- Columnas de trabajo o descanso generadas dinámicamente -->
                <ng-container *ngFor="let asig of misAsignacionesSemana">
                    <div class="columna descanso" *ngIf="asig.esDescanso">
                        Descanso
                    </div>

                    <div class="columna trabajo" *ngIf="!asig.esDescanso">
                        <div class="bloque-hora" style="margin-bottom: 5px;">{{ asig.horaInicio || asig.horaInicio }}</div>
                        <div class="bloque-romper" *ngIf="asig.horabreak || asig.horaalmuerzo" style="font-size: 0.75em; padding: 4px; border-radius: 4px;">
                            {{ asig.horabreak ? asig.horabreak : asig.horaalmuerzo }}|{{ asig.horaalmuerzo ? asig.horaalmuerzo : asig.horabreak }}
                        </div>
                        <div class="bloque-hora" style="margin-top: 5px;">{{ asig.horaFin || asig.horaFin }}</div>
                    </div>
                </ng-container>
            </div>
        </div>
    </section>
</div>
